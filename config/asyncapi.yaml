asyncapi: 3.1.0
info:
  title: Howestprime.Ticketing
  version: 1.0.0
  description: |
    This AsyncAPI specification describes the message broker configuration
    for suggestion create request/response flows in the Howestprime.Ticketing SAAS.
  x-metadata:
    BoundedContext: Ticketing

defaultContentType: application/json

servers:
  messageBroker:
    host: "{host}"
    protocol: amqp
    description: Local AMQP message broker
    variables:
      host:
        default: localhost:5672
        description: Host and port of the AMQP broker
    bindings:
      amqp:
        virtualHost: /

channels:
  thirdparty.service.suggestions.sendcreatesuggestion:
    address: thirdparty.service.suggestions.sendcreatesuggestion
    title: Send create suggestion
    messages:
      SuggestionSendCreateSuggestion:
        $ref: "#/components/messages/SuggestionSendCreateSuggestion"
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: howestprime
          type: topic
          routingKey: thirdparty.service.suggestions.sendcreatesuggestion

  howestprime.ticketing.suggestions.created:
    address: howestprime.ticketing.suggestions.created
    title: Suggestion created
    messages:
      SuggestionCreated:
        $ref: "#/components/messages/SuggestionCreated"
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: howestprime
          type: topic
          routingKey: howestprime.ticketing.suggestions.created

  howestprime.movies.movie.movieregistered:
    address: howestprime.movies.movie.movieregistered
    title: Movie registered
    messages:
      MovieRegistered:
        $ref: "#/components/messages/MovieRegistered"
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: howestprime
          type: topic
          routingKey: howestprime.movies.movie.movieregistered

  howestprime.movies.movieevent.bookingopened:
    address: howestprime.movies.movieevent.bookingopened
    title: Booking opened
    messages:
      BookingOpened:
        $ref: "#/components/messages/BookingOpened"
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: howestprime
          type: topic
          routingKey: howestprime.movies.movieevent.bookingopened

  howestprime.ticketing.orders.addcustomertoorder:
    address: howestprime.ticketing.orders.addcustomertoorder
    title: Add customer to order
    messages:
      AddCustomerToOrder:
        $ref: "#/components/messages/AddCustomerToOrder"
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: howestprime
          type: topic
          routingKey: howestprime.ticketing.orders.addcustomertoorder

  howestprime.ticketing.payment.paymentsuccess:
    address: howestprime.ticketing.payment.paymentsuccess
    title: Payment success
    messages:
      PaymentSuccess:
        $ref: "#/components/messages/PaymentSuccess"
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: howestprime
          type: topic
          routingKey: howestprime.ticketing.payment.paymentsuccess

  howestprime.ticketing.payment.paymentfailed:
    address: howestprime.ticketing.payment.paymentfailed
    title: Payment failed
    messages:
      PaymentFailed:
        $ref: "#/components/messages/PaymentFailed"
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: howestprime
          type: topic
          routingKey: howestprime.ticketing.payment.paymentfailed

operations:
  WhenSuggestionSendCreateSuggestion:
    action: receive
    channel:
      $ref: "#/channels/thirdparty.service.suggestions.sendcreatesuggestion"
    description: |
      Triggered when an external producer requests suggestion creation.
      Consumes the message and delegates to the CreateSuggestion command use case.
    messages:
      - $ref: "#/channels/thirdparty.service.suggestions.sendcreatesuggestion/messages/SuggestionSendCreateSuggestion"

  sendSuggestionCreated:
    action: send
    channel:
      $ref: "#/channels/howestprime.ticketing.suggestions.created"
    description: |
      Triggered after a suggestion is created successfully.
      Publishes the created suggestion payload for downstream consumers.
    messages:
      - $ref: "#/channels/howestprime.ticketing.suggestions.created/messages/SuggestionCreated"

  WhenMovieRegistered:
    action: receive
    channel:
      $ref: "#/channels/howestprime.movies.movie.movieregistered"
    description: |
      Triggered when a movie is registered in the Movies microservice.
      Consumes the message and delegates to the SaveMovie use case.
    messages:
      - $ref: "#/channels/howestprime.movies.movie.movieregistered/messages/MovieRegistered"

  WhenBookingOpened:
    action: receive
    channel:
      $ref: "#/channels/howestprime.movies.movieevent.bookingopened"
    description: |
      Triggered when a booking is opened in the Movies microservice.
      Consumes the message and delegates to the CreateOrderFromBooking use case.
    messages:
      - $ref: "#/channels/howestprime.movies.movieevent.bookingopened/messages/BookingOpened"

  WhenAddCustomerToOrder:
    action: receive
    channel:
      $ref: "#/channels/howestprime.ticketing.orders.addcustomertoorder"
    description: |
      Triggered when a customer needs to be added to an existing order.
      Consumes the message and delegates to the AddCustomerToOrder use case.
    messages:
      - $ref: "#/channels/howestprime.ticketing.orders.addcustomertoorder/messages/AddCustomerToOrder"

  SendPaymentSuccess:
    action: send
    channel:
      $ref: "#/channels/howestprime.ticketing.payment.paymentsuccess"
    description: |
      Triggered after a payment has been processed successfully.
      Publishes the payment success payload for downstream consumers.
    messages:
      - $ref: "#/channels/howestprime.ticketing.payment.paymentsuccess/messages/PaymentSuccess"

  SendPaymentFailed:
    action: send
    channel:
      $ref: "#/channels/howestprime.ticketing.payment.paymentfailed"
    description: |
      Triggered after a payment has failed.
      Publishes the payment failure payload for downstream consumers.
    messages:
      - $ref: "#/channels/howestprime.ticketing.payment.paymentfailed/messages/PaymentFailed"

components:
  messages:
    SuggestionSendCreateSuggestion:
      name: SuggestionSendCreateSuggestion
      title: Suggestion create request
      summary: Request message to create a suggestion.
      payload:
        $ref: "#/components/schemas/SuggestionSendCreateSuggestionPayload"

    SuggestionCreated:
      name: SuggestionCreated
      title: Suggestion created
      summary: Event message emitted after a suggestion is created.
      payload:
        $ref: "#/components/schemas/SuggestionCreatedPayload"

    MovieRegistered:
      name: MovieRegistered
      title: Movie registered
      summary: Event message emitted when a movie is registered in Movies microservice.
      payload:
        $ref: "#/components/schemas/MovieRegisteredPayload"

    BookingOpened:
      name: BookingOpened
      title: Booking opened
      summary: Event message emitted when a booking is opened in the Movies microservice.
      payload:
        $ref: "#/components/schemas/BookingOpenedPayload"

    AddCustomerToOrder:
      name: AddCustomerToOrder
      title: Add customer to order
      summary: Command message to add customer information and terms acceptance to an order.
      payload:
        $ref: "#/components/schemas/AddCustomerToOrderPayload"

    PaymentSuccess:
      name: PaymentSuccess
      title: Payment success
      summary: Event message emitted after a payment succeeds.
      payload:
        $ref: "#/components/schemas/PaymentSuccessPayload"

    PaymentFailed:
      name: PaymentFailed
      title: Payment failed
      summary: Event message emitted after a payment fails.
      payload:
        $ref: "#/components/schemas/PaymentFailedPayload"

  schemas:
    SuggestionSendCreateSuggestionPayload:
      type: object
      required:
        - email
        - title
        - description
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Email address of the suggestion author.
          example: user@example.com
        title:
          type: string
          minLength: 3
          maxLength: 120
          description: Short title of the suggestion.
          example: Improve booking performance
        description:
          type: string
          minLength: 10
          maxLength: 2000
          description: Detailed suggestion text.
          example: Cache frequently requested movie data to reduce latency.

    SuggestionCreatedPayload:
      type: object
      required:
        - suggestionId
        - email
        - title
        - description
        - occurredOn
      properties:
        suggestionId:
          type: string
          format: uuid
          description: Identifier of the created suggestion.
          example: 8fdd8b8e-8de4-4b9a-8e16-868b72f4f469
        email:
          type: string
          format: email
          maxLength: 254
          description: Email address of the suggestion author.
          example: user@example.com
        title:
          type: string
          minLength: 3
          maxLength: 120
          description: Short title of the suggestion.
          example: Improve booking performance
        description:
          type: string
          minLength: 10
          maxLength: 2000
          description: Detailed suggestion text.
          example: Cache frequently requested movie data to reduce latency.
        occurredOn:
          type: string
          format: date-time
          description: UTC timestamp when the event occurred.
          example: "2026-03-24T10:15:30.000Z"

    MovieRegisteredPayload:
      type: object
      required:
        - movieId
        - title
        - duration
        - genres
        - ageRating
        - posterUrl
      properties:
        movieId:
          type: string
          description: Identifier of the movie.
          example: 8fdd8b8e-8de4-4b9a-8e16-868b72f4f469
        title:
          type: string
          description: Movie title.
          example: The Great Booking
        duration:
          type: number
          description: Movie duration in minutes.
          example: 120
        genres:
          type: array
          items:
            type: string
          description: List of genres for the movie.
          example: [Drama, Thriller]
        ageRating:
          type: string
          description: Age rating for the movie.
          example: 12+
        posterUrl:
          type: string
          description: URL to the movie poster image.
          example: https://example.com/poster.jpg

    BookingOpenedPayload:
      type: object
      required:
        - bookingId
        - movieId
        - room
        - showtime
        - standardVisitors
        - discountedVisitors
        - seatNumbers
      properties:
        bookingId:
          type: string
          format: uuid
          description: Identifier of the booking.
          example: 8fdd8b8e-8de4-4b9a-8e16-868b72f4f469
        movieId:
          type: string
          format: uuid
          description: Identifier of the movie.
          example: 9d3b3cf0-81a6-4f07-aad8-8f5d56f1c2d1
        room:
          type: string
          description: Room name where the movie will be shown.
          example: Room A
        showtime:
          type: string
          format: date-time
          description: Scheduled start time of the movie.
          example: "2026-05-14T18:30:00.000Z"
        standardVisitors:
          type: integer
          minimum: 0
          description: Count of standard ticket holders.
          example: 2
        discountedVisitors:
          type: integer
          minimum: 0
          description: Count of discounted ticket holders.
          example: 1
        seatNumbers:
          type: array
          minItems: 1
          items:
            type: integer
            minimum: 1
          description: Reserved seat numbers.
          example:
            - 12
            - 13
            - 14

    AddCustomerToOrderPayload:
      type: object
      required:
        - orderId
        - customerSalutation
        - customerFirstName
        - customerLastName
        - email
        - agreeToTerms
      properties:
        orderId:
          type: string
          format: uuid
          description: Identifier of the order to add customer to.
          example: 5ec4499c-fd90-4255-aa6a-c744b24302d6
        customerSalutation:
          type: string
          enum:
            - Mr.
            - Ms.
            - Mx.
          description: Customer salutation title.
          example: Mr.
        customerFirstName:
          type: string
          minLength: 1
          description: Customer first name.
          example: John
        customerLastName:
          type: string
          minLength: 1
          description: Customer last name.
          example: Doe
        email:
          type: string
          format: email
          maxLength: 254
          description: Customer email address.
          example: john.doe@example.com
        agreeToTerms:
          type: boolean
          description: Whether customer agrees to terms and conditions.
          example: true

    PaymentSuccessPayload:
      type: object
      required:
        - paymentId
        - orderId
        - bookingId
      properties:
        paymentId:
          type: string
          format: uuid
          description: Identifier of the payment.
          example: 9b8f3a5a-0c2c-4a5a-9c1a-2c7ed5d2f9b1
        orderId:
          type: string
          format: uuid
          description: Identifier of the order.
          example: 5ec4499c-fd90-4255-aa6a-c744b24302d6
        bookingId:
          type: string
          format: uuid
          description: Identifier of the booking.
          example: 1d3c4f5a-1111-2222-3333-444455556666

    PaymentFailedPayload:
      type: object
      required:
        - paymentId
        - orderId
        - bookingId
        - reason
      properties:
        paymentId:
          type: string
          format: uuid
          description: Identifier of the payment.
          example: 9b8f3a5a-0c2c-4a5a-9c1a-2c7ed5d2f9b1
        orderId:
          type: string
          format: uuid
          description: Identifier of the order.
          example: 5ec4499c-fd90-4255-aa6a-c744b24302d6
        bookingId:
          type: string
          format: uuid
          description: Identifier of the booking.
          example: 1d3c4f5a-1111-2222-3333-444455556666
        reason:
          type: string
          description: Reason why the payment failed.
          example: Payment declined by provider
